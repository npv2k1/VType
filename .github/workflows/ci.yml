name: macOS CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test core package
        run: swift test
      - name: Build app
        run: |
          xcodebuild build \
            -project VType.xcodeproj \
            -scheme VType \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
